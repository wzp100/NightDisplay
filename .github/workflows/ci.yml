name: Windows build and checks
on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline compiler build and integration checks
        shell: powershell
        run: ./build.ps1 -Test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify SDK projects
        run: dotnet build NightDisplay.sln -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: NightDisplay-windows-x64
          path: |
            artifacts/release/NightDisplay.exe
            artifacts/release/NightDisplay.Guard.exe
            artifacts/release/driver/
            artifacts/release/LICENSE
            artifacts/release/THIRD-PARTY-NOTICES.md

  release:
    # Tag pushes build the distributable packages and publish them to a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version from tag
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Offline compiler build and integration checks
        shell: powershell
        run: ./build.ps1 -Test
      - name: Build portable package
        shell: powershell
        run: ./scripts/package.ps1
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build installer package
        shell: powershell
        run: ./scripts/build-installer.ps1 -Version $env:VERSION
      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          $tag = $env:GITHUB_REF_NAME
          $zip = "artifacts/NightDisplay-$version-win-x64.zip"
          $setup = "artifacts/NightDisplay-$version-setup-x64.exe"
          foreach ($file in @($zip, $setup)) {
            if (-not (Test-Path $file)) { throw "缺少发布产物：$file" }
          }
          $notes = @"
          ## NightDisplay $version

          让屏幕休息，让后台工作继续。

          ### 下载

          | 方式 | 文件 |
          | --- | --- |
          | **安装版（推荐）** | ``NightDisplay-$version-setup-x64.exe`` |
          | 便携版 | ``NightDisplay-$version-win-x64.zip`` |

          安装版需要管理员权限，提供开始菜单、可选桌面快捷方式、可选驱动安装与标准卸载；
          卸载前自动恢复实体屏并退出后台。便携版解压即用，保持文件同目录即可。

          快速开始、快捷键与安全边界见仓库 README。应用未做代码签名，SmartScreen 可能提示「未知发布者」，请确认下载来源为本仓库 Releases。
          "@
          gh release view $tag --json tagName > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --notes $notes
            gh release upload $tag $zip $setup --clobber
          } else {
            gh release create $tag $zip $setup --title "NightDisplay $version" --notes $notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw '发布 Release 失败。' }
